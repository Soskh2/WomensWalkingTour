<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flutter App Demo</title>
  <style>
    body {
      background: #f0f0f0;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      font-family: sans-serif;
    }

    .phone-frame {
      width: 320px;
      height: 90%;
      background: #000;
      border: 16px solid #333;
      border-radius: 36px;
      box-shadow: 0 0 30px rgba(0,0,0,0.3);
      overflow: hidden;
      position: relative;
    }

    .phone-screen {
      width: 100%;
      height: 100%;
      border: none;
    }

    .notch {
      width: 210px;
      height: 30px;
      background: #000;
      border-radius: 0 0 15px 15px;
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
    }
  </style>
</head>
<body>
  <div class="phone-frame">
    <div class="notch"></div>
    <iframe class="phone-screen" src="app.html"></iframe>
  </div>
</body>
</html>
