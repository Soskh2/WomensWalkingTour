<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flutter App Demo</title>
  <style>
    body {
      background: #f0f0f0;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      font-family: sans-serif;
    }

    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px; 
    }
    
    .text {
      font-size: 12px;
      color: #333;
      max-width: 280px;
      text-align: center;
      padding: 0 10px;
      font-weight: bold;
    }

    .phone-frame {
      width: 320px;
      height: 85vh;
      background: #000;
      border: 16px solid #333;
      border-radius: 36px;
      box-shadow: 0 0 30px rgba(0,0,0,0.3);
      overflow: hidden;
      position: relative;
    }

    .phone-screen {
      width: 100%;
      height: 100%;
      border: none;
    }

    .notch {
      width: 210px;
      height: 20px;
      background: #000;
      border-radius: 0 0 15px 15px;
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="phone-frame">
      <div class="notch"></div>
      <iframe class="phone-screen" src="app.html"></iframe>
    </div>
    <div class="text">
      <p>Please note that this unofficial app is for demonstration purposes only and does not represent Yale University in any way.</p>
    </div>
  </div>
</body>
</html>
